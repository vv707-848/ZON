# The Flutter app: format, analysis (0 issues), tests, and an Android build — on every push that touches it. The
# SDK is pinned to the latest stable at the last audit (docs/versions.md); the run prints its exact version.
name: App

on:
  push:
    paths:
      - app/**
      - .github/workflows/app.yml
      - .github/scripts/**
  pull_request:
    paths:
      - app/**
      - .github/workflows/app.yml
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App · Flutter stable
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        # bash -eo pipefail: a failing command before `| tee` fails its step. The workflow-level default does not
        # reach a job with its own defaults.run — without this line the tests could fail and the run stay green.
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: SDK version
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/version.log"
          ../.github/scripts/annotate.sh notice "Flutter SDK" "$RUNNER_TEMP/version.log" 10

      - name: Packages
        id: packages
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/packages.log"

      - name: Explain a packages failure
        if: failure() && steps.packages.outcome == 'failure'
        run: ../.github/scripts/annotate.sh error "flutter pub get" "$RUNNER_TEMP/packages.log" 60

      - name: Format
        id: format
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee "$RUNNER_TEMP/format.log"

      - name: Explain a format failure
        if: failure() && steps.format.outcome == 'failure'
        run: ../.github/scripts/annotate.sh error "dart format" "$RUNNER_TEMP/format.log" 60

      - name: Analyze
        id: analyze
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Explain an analysis failure
        if: failure() && steps.analyze.outcome == 'failure'
        run: ../.github/scripts/annotate.sh error "flutter analyze" "$RUNNER_TEMP/analyze.log" 120

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          flutter test --coverage 2>&1 | tee "$RUNNER_TEMP/tests.log"
          flutter test --dart-define=ZON_SIMULATIONS=false test/no_simulations_test.dart 2>&1 | tee -a "$RUNNER_TEMP/tests.log"

      - name: Explain a test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: ../.github/scripts/annotate.sh error "flutter test" "$RUNNER_TEMP/tests.log" 120

      - name: Coverage (floor 0% until the first measurement)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python3 -I ../.github/scripts/coverage.py coverage/lcov.info 0 App

      - name: Outdated packages (report only)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          flutter pub outdated 2>&1 | tee "$RUNNER_TEMP/outdated.log" || true
          ../.github/scripts/annotate.sh notice "App outdated packages" "$RUNNER_TEMP/outdated.log" 60

      # Applications commit their lock file; this run's resolution is kept so it can be committed.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        with:
          name: app-pubspec-lock
          path: app/pubspec.lock
          retention-days: 7

  # The Gradle side the tests cannot see: SDK levels, merged manifests, plugin versions, Kotlin, release signing.
  # A release APK signed as the store build will be, without the Firebase files (the app then builds without push).
  # It found minSdk 26 for Sentry's Android SDK.
  android:
    name: App · Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle.kts
            app/android/app/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Packages
        run: flutter pub get

      # android/key.properties names an upload key, as the owner's will (app/README.md «بناء نسخ المتاجر»); a
      # throwaway one here. apksigner then shows the APK carries that key, not the debug one Google Play refuses.
      - name: Release APK, signed with an upload key
        id: build
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storepass ci-upload-key -keypass ci-upload-key -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI upload key" -noprompt
          printf 'storeFile=%s\nstorePassword=ci-upload-key\nkeyAlias=upload\nkeyPassword=ci-upload-key\n' "$RUNNER_TEMP/upload.jks" > android/key.properties
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build.log"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/signer.txt" 2>&1
          cat "$RUNNER_TEMP/signer.txt" | tee -a "$RUNNER_TEMP/build.log"
          grep -q "CN=CI upload key" "$RUNNER_TEMP/signer.txt"

      - name: Explain a build failure
        if: failure() && steps.build.outcome == 'failure'
        run: ../.github/scripts/annotate.sh error "Android build" "$RUNNER_TEMP/build.log" 80
