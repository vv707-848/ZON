# The model lab against a hosted endpoint (Groq or OpenRouter, known from the key): the golden cases answered by a
# real model that someone else serves, so the model family can be read before a GPU is rented. Not the production
# node: its engine and quantisation are the host's. The cases are synthetic — nothing of a user is sent.
#
# Runs when someone with write access asks for it: «Run workflow», or a push to a `lab-run/**` branch. The key is a
# repository secret — LAB_API_KEY, or OPENROUTER_API_KEY as it was first named — never a file, never an input (the
# repository is public). Before a case is spent the host is probed as the service asks (zon_agents/lab/hosted.py).
name: Model lab (hosted)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: The profile whose sampling is used (agents/zon_agents/models)
        default: qwen3.8-27b-fp8
      model:
        description: Another model id at the host (empty = its Qwen3.8-27B)
        default: ''
      agents:
        description: Only these agents, comma-separated (empty = all)
        default: ''
      sample:
        description: Cases of each agent (0 = all · empty = what the host's daily limit allows)
        default: ''
      shift:
        description: Another day's sample — every pick moved this many cases on (empty = the first sample)
        default: ''
  push:
    branches: ['lab-run/**']

concurrency:
  group: lab-hosted
  cancel-in-progress: false

permissions:
  contents: read

env:
  LLM_API_KEY: ${{ secrets.LAB_API_KEY || secrets.OPENROUTER_API_KEY }}
  PROFILE: ${{ inputs.profile || 'qwen3.8-27b-fp8' }}
  MODEL: ${{ inputs.model }}
  AGENTS: ${{ inputs.agents }}
  SAMPLE: ${{ inputs.sample }}
  SHIFT: ${{ inputs.shift }}

jobs:
  lab:
    name: Lab · hosted model
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agents/uv.lock
      - run: uv sync --locked

      - name: The host, probed before a case is spent
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Add the repository secret LAB_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          uv run zon-agents lab plan --model "$MODEL" --agents "$AGENTS" ${SAMPLE:+--sample "$SAMPLE"} ${SHIFT:+--sample-shift "$SHIFT"} > "$RUNNER_TEMP/plan.txt"

      - name: The cases against the model
        run: |
          # the plan is one shell-quoted line of arguments written by `lab plan` (shlex.join)
          eval "set -- $(cat "$RUNNER_TEMP/plan.txt")"
          uv run zon-agents lab run --profile "$PROFILE" "$@" --budget 90 \
            --out "$RUNNER_TEMP/lab-hosted.json" | tee "$RUNNER_TEMP/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The cases that failed or scored under 1
        run: |
          uv run python - "$RUNNER_TEMP/lab-hosted.json" <<'PY'
          import json, sys
          for o in json.load(open(sys.argv[1]))["outcomes"]:
              if o["error"] or o["score"] < 1:
                  print(o["agent"], o["case"], o["variant"], o["score"], o["error"] or "", json.dumps(o["metrics"], ensure_ascii=False))
                  print("   wrote:", json.dumps(o["output"], ensure_ascii=False)[:700])  # synthetic cases: nothing of a user
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-hosted-report
          path: ${{ runner.temp }}/lab-hosted.json
          if-no-files-found: ignore
