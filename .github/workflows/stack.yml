# The one command (compose.yaml) works from a fresh clone: the whole stack comes up, the website, the panel and
# the agents service answer, and zon:doctor finds the database, its migrations, Redis, the SuperAgent's account,
# the queues and the masking healthy. What needs the AI node or real keys is reported, not required.
name: Stack

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - compose.yaml
      - docker/**
      - agents/zon_agents/sim/**
      - deploy/php/**
      - deploy/mysql/**
      - deploy/nginx/**
      - backend/composer.lock
      - backend/database/**
      - agents/uv.lock
      - .github/workflows/stack.yml
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nginx:
    # deploy/nginx/zon.conf on the version production installs (nginx.org's 1.30 branch: `http2 on;` needs 1.25.1
    # or later, Ubuntu's 1.24 refuses it). `nginx -t` reads every directive and opens every listen, IPv6 included.
    name: nginx -t (1.30)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The production config is valid
        run: |
          for host in zon.sa api.zon.sa media.zon.sa; do
            mkdir -p "$RUNNER_TEMP/le/live/$host"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$host" \
              -keyout "$RUNNER_TEMP/le/live/$host/privkey.pem" -out "$RUNNER_TEMP/le/live/$host/fullchain.pem" 2>/dev/null
          done
          docker run --rm --network host \
            -v "$PWD/deploy/nginx/zon.conf:/etc/nginx/conf.d/default.conf:ro" -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" \
            nginx:1.30 sh -c 'nginx -v && nginx -t'

  stack:
    name: docker compose up
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Up, from nothing
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: The website, the panel and the agents service answer
        run: |
          for url in http://localhost:8000/up http://localhost:8000/ http://localhost:8000/admin/login http://localhost:8000/api/v1/app/config http://localhost:8100/agents/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Platform: ios' -H 'X-App-Version: 9.9.9' "$url")
            echo "$code $url"
            [[ "$code" == 200 ]]
          done

      # The AI node is the simulation here (compose.yaml `ai-sim`): the agents service reaches it, says it is one,
      # and answers a search through it — the rule model's order, known before it runs.
      - name: The AI answers through the simulated node, and says it is a simulation
        run: |
          health=$(curl -s http://localhost:8100/agents/health); echo "$health"
          python3 -I - "$health" <<'PY'
          import json, sys, urllib.request
          health = json.loads(sys.argv[1])
          assert (health["model"], health["simulated"], health["llm"], health["embed"], health["qdrant"]) == ("sim-rules", True, True, True, True), health
          need = {"city": "الرياض", "neighborhood": "النرجس", "property_type": "apartment", "budget_max": 900000, "free_text": "مدخل خاص"}
          offers = [{"id": 3, "type": "apartment", "neighborhood": "النرجس", "price": 850000, "desc": "شقة واسعة"},
                    {"id": 2, "type": "apartment", "neighborhood": "النرجس", "price": 2000000, "desc": "شقة بمدخل خاص"},
                    {"id": 1, "type": "apartment", "neighborhood": "النرجس", "price": 880000, "desc": "شقة بمدخل خاص"}]
          request = urllib.request.Request("http://localhost:8100/agents/search_listings", json.dumps({"need": need, "candidates": offers, "limit": 10}).encode(),
                                           {"Content-Type": "application/json", "X-Internal-Key": "dev-only-internal-key"})
          answer = json.load(urllib.request.urlopen(request, timeout=20))
          print(answer)
          assert answer["simulated"] is True and answer["degraded"] is False, answer
          assert [(r["id"], r["score"]) for r in answer["output"]["results"]] == [(1, 0.95), (3, 0.45)], answer  # 2 is far over the budget: not shown (owner, 21 Nov)
          PY

      - name: zon:doctor on the stack
        run: |
          sleep 65                                   # the scheduler's first heartbeat (every minute)
          docker compose exec -T web php artisan zon:doctor --json > doctor.json || true
          python3 -I - doctor.json <<'PY'
          import json, sys
          checks = {c["key"]: c for c in json.load(open(sys.argv[1]))}
          for c in checks.values():
              print(f'{c["status"]:5} {c["key"]:12} {c["detail"]}')
          required = ["database", "migrations", "redis", "scheduler", "queues", "report_db", "masking", "storage", "uploads", "websockets"]
          bad = [k for k in required if checks[k]["status"] != "ok"]
          sys.exit(f"not ok: {bad}" if bad else 0)
          PY

      - name: Logs of a failed start
        if: failure()
        run: docker compose logs --no-color --tail=200
