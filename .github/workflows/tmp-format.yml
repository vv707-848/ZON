# Temporary: formats the app's Dart files and prints the diff (base64) so it can be applied where Dart cannot run.
name: tmp-format
on:
  push:
    branches: [decisions]
jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get > /dev/null
      - run: dart format lib test
      - run: |
          git diff > "$RUNNER_TEMP/format.diff"
          echo "DIFF_LINES $(wc -l < "$RUNNER_TEMP/format.diff")"
          echo "DIFF_START"; base64 -w0 "$RUNNER_TEMP/format.diff"; echo; echo "DIFF_END"
      - run: flutter analyze 2>&1 | tail -30 || true
