# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          composer install --no-interaction --prefer-dist --no-progress -q
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $t = 'كلمني 055 123 4567';
          $A = '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~';
          echo 'autoload only: ', preg_match($A, $t), "\n";
          echo 'text(): ', App\Ai\Masking\AiMasking::text($t), "\n";
          echo 'after: ', preg_match($A, $t), ' ', preg_match('~0\d(?: ?\d){7,8}~', $t), ' ', preg_match('~\d~', $t), ' ', preg_match('~ ~', $t), "\n";
          PHP
          php /tmp/probe.php
          php -d pcre.jit=0 /tmp/probe.php
          cat > /tmp/probe2.php <<'PHP'
          <?php
          $t = 'كلمني 055 123 4567';
          echo 'no autoload: ', preg_match('~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~', $t), "\n";
          require 'vendor/autoload.php';
          echo 'after autoload: ', preg_match('~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~', $t), "\n";
          var_dump(setlocale(LC_ALL, 0), mb_internal_encoding(), ini_get('default_charset'));
          foreach (get_included_files() as $f) if (str_contains($f, 'symfony/polyfill') || str_contains($f, 'functions')) echo $f, "\n";
          PHP
          php /tmp/probe2.php
