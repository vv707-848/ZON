# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          $t = 'كلمني 055 123 4567';
          $variants = [
            'A first' => '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
            'B no lookbehind' => '~\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
            'C no paren' => '~(?<!\d)0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
            'D no lookahead' => '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}~',
            'E ascii class' => '~(?<![0-9])[(]?0[0-9](?:[ \t.()-]{0,2}[0-9]){7,8}(?![0-9])~',
            'F u flag' => '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~u',
            'G ascii only' => '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
          ];
          foreach ($variants as $k => $re) { echo $k, ': ', preg_match($re, $t), ' / ascii: ', preg_match($re, '055 123 4567'), ' / prefixed: ', preg_match($re, 'x 055 123 4567'), "\n"; }
          ini_set('pcre.jit', '0');
          foreach ($variants as $k => $re) { echo 'nojit ', $k, ': ', preg_match($re.'S', $t), "\n"; }
          PHP
          php /tmp/probe.php
          php -n /tmp/probe.php
