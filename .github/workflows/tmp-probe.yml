# Temporary: AiMasking misses «055 123 4567» on some runners only. Which CPU, and does PCRE's JIT do it?
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'app/Support/ArabicText.php';
          require 'app/Ai/Masking/AiMasking.php';
          $t = 'كلمني 055 123 4567';
          $out = [];
          foreach (['كلمني 055 123 4567', 'كلمني 055-123-4567', 'كلمني (055) 123 4567', 'كلمني 0551234567', 'اتصل 0501112223', 'كلمني +966 55 123 4567'] as $x) { $out[] = App\Ai\Masking\AiMasking::text($x); }
          echo 'jit=', ini_get('pcre.jit'), ' ', json_encode($out, JSON_UNESCAPED_UNICODE), "\n";
          PHP
          grep -m1 "model name" /proc/cpuinfo; grep -m1 -o "avx512[a-z]*" /proc/cpuinfo | head -1; grep -c processor /proc/cpuinfo
          php /tmp/probe.php
          php -d pcre.jit=0 /tmp/probe.php
