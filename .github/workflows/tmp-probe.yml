# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'app/Support/ArabicText.php';
          require 'app/Ai/Masking/AiMasking.php';
          $file = array_keys((new ReflectionClassConstant(App\Ai\Masking\AiMasking::class, 'PATTERNS'))->getValue())[5];
          $built = '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~';
          $t = 'كلمني 055 123 4567';
          echo 'same bytes: ', var_export($file === $built, true), ' ', bin2hex($file), "\n";
          echo 'built: ', preg_match($built, $t), ' file: ', preg_match($file, $t), "\n";
          $d = App\Support\ArabicText::asciiDigits($t);
          echo 'digits same: ', var_export($d === $t, true), ' ', bin2hex($d), "\n";
          echo 'text(): ', App\Ai\Masking\AiMasking::text($t), "\n";
          echo 'after text, built: ', preg_match($built, $t), "\n";
          PHP
          php /tmp/probe.php
          php -d opcache.enable_cli=0 /tmp/probe.php
          php -i | grep -i "opcache.enable\|opcache.jit"
