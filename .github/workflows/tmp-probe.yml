# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          if (($argv[1] ?? '') === 'req') { require 'app/Support/ArabicText.php'; require 'app/Ai/Masking/AiMasking.php'; }
          $t = 'كلمني 055 123 4567';
          $c = [
            'A' => '~(?<!\d)\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
            'B09' => '~(?<![0-9])\(?0[0-9](?:[\s.\-()]{0,2}[0-9]){7,8}(?![0-9])~',
            'Cnolb' => '~\(?0\d(?:[\s.\-()]{0,2}\d){7,8}(?!\d)~',
            'Dsp' => '~(?<!\d)\(?0\d(?:[ .\-()]{0,2}\d){7,8}(?!\d)~',
            'Erun' => '~[+(]?\d[\d\s.\-()]*\d~',
            'Fs' => '~[\s]~',
            'Gs2' => '~0\d(?:\s?\d){7,8}~',
          ];
          echo $argv[1] ?? 'plain', ' jit=', ini_get('pcre.jit'), ': ';
          foreach ($c as $k => $re) { echo $k, '=', preg_match($re, $t), ' '; }
          echo "\n";
          PHP
          php /tmp/probe.php plain; php /tmp/probe.php req; php -d pcre.jit=0 /tmp/probe.php req
          sed -n 1,5p app/Ai/Masking/AiMasking.php | od -c | head -3
