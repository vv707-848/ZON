# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          composer install --no-interaction --prefer-dist --no-progress -q
          php --ri pcov || true
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'app/Support/ArabicText.php';
          require 'app/Ai/Masking/AiMasking.php';
          $file = array_keys((new ReflectionClassConstant(App\Ai\Masking\AiMasking::class, 'PATTERNS'))->getValue())[5];
          $t = 'كلمني 055 123 4567';
          echo 'pcov=', ini_get('pcov.enabled'), ' dir=', ini_get('pcov.directory'), ' match: ', preg_match($file, $t), ' text(): ', App\Ai\Masking\AiMasking::text($t), "\n";
          PHP
          php /tmp/probe.php
          php -d pcov.enabled=0 /tmp/probe.php
          php -d pcov.directory=/nowhere /tmp/probe.php
          vendor/bin/phpunit --colors=never tests/Unit/AiMaskingTest.php 2>&1 | tail -3
          php -d pcov.enabled=0 vendor/bin/phpunit --colors=never tests/Unit/AiMaskingTest.php 2>&1 | tail -3
