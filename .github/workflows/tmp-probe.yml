# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'app/Support/ArabicText.php';
          require 'app/Ai/Masking/AiMasking.php';
          $r = new ReflectionClassConstant(App\Ai\Masking\AiMasking::class, 'PATTERNS');
          $p = $r->getValue();
          foreach (['كلمني 055 123 4567', 'كلمني 055-123-4567', 'كلمني +966 55 123 4567'] as $t) {
            echo $t, ' => ', App\Ai\Masking\AiMasking::text($t), "\n";
            foreach ($p as $re => $to) { $n = preg_match($re, $t, $m); echo '  ', $n === false ? 'ERR '.preg_last_error_msg() : $n, ' ', $re, ' ', json_encode($m, JSON_UNESCAPED_UNICODE), "\n"; }
          }
          PHP
          php /tmp/probe.php
