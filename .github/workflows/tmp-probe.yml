# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          cat > /tmp/probe.php <<'PHP'
          <?php
          $sep = '[\s.\-()]{0,2}';
          $P = [
            '~\b(?:https?://|www\.)\S+~iu' => 'L', '~[\w.+-]+@[\w-]+\.[\w.-]+~u' => 'E', '~\bSA\d{2}(?:[\s-]?\d){18,24}~i' => 'I',
            '~(?:\+|00)\s?\(?966\)?'.$sep.'\d(?:'.$sep.'\d){7,8}~' => 'P1', '~(?<!\d)\(?966\)?'.$sep.'5(?:'.$sep.'\d){8}(?!\d)~' => 'P2',
            '~(?<!\d)\(?0\d(?:'.$sep.'\d){7,8}(?!\d)~' => 'P3', '~(?<!\d)5\d(?:'.$sep.'\d){7}(?!\d)~' => 'P4',
            '~(?<!\d)(?:9200|800)(?:'.$sep.'\d){5,6}(?!\d)~' => 'P5', '~\d{9,}~' => 'P6',
          ];
          $t = 'كلمني 055 123 4567';
          $mode = $argv[1];
          if ($mode === 'single-first') { echo 'P3 alone: ', preg_match(array_keys($P)[5], $t), "\n"; }
          if ($mode === 'u-first') { preg_match('~x~u', 'x'); echo 'after a /u pattern: ', preg_match(array_keys($P)[5], $t), "\n"; }
          if ($mode === 'i-first') { preg_match('~x~i', 'x'); echo 'after a /i pattern: ', preg_match(array_keys($P)[5], $t), "\n"; }
          if ($mode === 'iu-first') { preg_match('~x~iu', 'x'); echo 'after a /iu pattern: ', preg_match(array_keys($P)[5], $t), "\n"; }
          if ($mode === 'array') { echo 'array: ', preg_replace(array_keys($P), array_values($P), $t), "\n"; }
          if ($mode === 'loop') { $x = $t; foreach ($P as $re => $to) { $x = preg_replace($re, $to, $x); } echo 'loop: ', $x, "\n"; }
          if ($mode === 'ascii-sep') { $s2 = '[ \t\n.()-]{0,2}'; echo 'ascii sep after /u: ', preg_match('~x~u','x'), preg_match('~(?<!\d)\(?0\d(?:'.$s2.'\d){7,8}(?!\d)~', $t), "\n"; }
          if ($mode === 'all-u') { preg_match('~x~u','x'); echo 'P3 with /u after /u: ', preg_match(array_keys($P)[5].'u', $t), "\n"; }
          PHP
          for m in single-first u-first i-first iu-first array loop ascii-sep all-u; do php /tmp/probe.php $m; done
