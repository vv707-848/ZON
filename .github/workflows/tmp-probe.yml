# Temporary: why AiMasking misses «055 123 4567» on the runner (passes locally, same PHP 8.5.12).
name: tmp-probe
on:
  push:
    branches: [probe-pcre]
jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: pcov
      - run: |
          printf '%s\n' '<?php' '$t = "كلمني 055 123 4567";' 'echo getcwd(), " jit=", ini_get("pcre.jit"), " => ", preg_match("~(?<!\\d)\\(?0\\d(?:[\\s.\\-()]{0,2}\\d){7,8}(?!\\d)~", $t), " ascii=", preg_match("~(?<!\\d)\\(?0\\d(?:[\\s.\\-()]{0,2}\\d){7,8}(?!\\d)~", "055 123 4567"), PHP_EOL;' > /tmp/lit.php
          cat /tmp/lit.php
          for i in 1 2 3; do php /tmp/lit.php; php -d pcre.jit=0 /tmp/lit.php; done
          cd /tmp && for i in 1 2 3; do php /tmp/lit.php; php -d pcre.jit=0 /tmp/lit.php; done
