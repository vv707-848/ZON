[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zon-agents"
version = "1.0.0"
description = "Zon agents service: PydanticAI + MCP + Qdrant, called by Laravel only (docs/contracts/agents-api.md)"
requires-python = ">=3.12"
# Official packages at pinned versions only (architecture §8 «قاعدة تبعيات»); uv.lock freezes the rest, for every platform.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pydantic-ai-slim[openai]==2.64.0",
    "mcp==2.3.0",
    "qdrant-client==1.20.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Perceptual image hashes on the CPU (POST /media/phash) — idealo/imagededup, heavy (torch); optional.
phash = ["imagededup==0.3.3.post2"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3", "mypy==2.4.1"]

[project.scripts]
zon-agents = "zon_agents.cli:main"

[tool.setuptools.packages.find]
include = ["zon_agents*"]

[tool.setuptools.package-data]
zon_agents = ["prompts/*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text is intended
    "RUF012",                      # pydantic copies mutable defaults per instance
]

[tool.mypy]
python_version = "3.12"
packages = ["zon_agents"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["imagededup.*", "PIL.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
