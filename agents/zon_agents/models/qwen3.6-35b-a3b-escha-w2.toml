# Qwen3.6-35B-A3B بضغط Escha-W2: خبراء بدقة 2/3-bit وطبقات كثيفة int8 (12.3GB). المعتمد في المعمارية حتى يحسم المختبر.
# مزوّده لم يقيّمه على العربية، ويطابق النموذج الكامل في التوكن الأرجح بنسبة 89.9% (README المزوّد).
# يعمل بوقت تشغيل المزوّد (نسخته من SGLang مربوطة بـ torch 2.9)، لا بالمحرك الرسمي.
name = "qwen3.6-35b-a3b-escha-w2"
weights = "EschaLabs/Qwen3.6-35B-A3B-Escha-W2"
runtime = "escha"
licence = "Apache-2.0"

[sampling]
json = { temperature = 0.3, top_p = 0.8, max_tokens = 700 }
summary = { temperature = 0.4, top_p = 0.8, max_tokens = 600 }
report = { temperature = 0.4, top_p = 0.8, max_tokens = 900 }
chat = { temperature = 0.7, top_p = 0.8, max_tokens = 500, presence_penalty = 1.5 }

[request]
top_k = 20

# سكربت المزوّد serve.sh يقرأ هذه المتغيرات (INSTALL.md في escha-runtime-qwen3moe): رسوم CUDA تمنع بطئاً يقارب
# 4.4 مرة، وRADIX مطفأ لأنه يكلف نحو 20% من سرعة المستخدم الواحد، وTHINK=0 يطفئ التفكير في الخادم.
[serve.env]
CTXLEN = "32768"
MAXREQ = "8"
MAXMAMBA = "8"
RADIX = "0"
GRAPHS = "1"
CUDA_GRAPH_BS = "1 2 4 8"
THINK = "0"
INT8 = "on"
MEM = "0.75"
