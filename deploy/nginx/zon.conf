# /etc/nginx/sites-available/zon.conf — app node (Jeddah). Nginx is the only service that faces the internet.
# api.zon.sa   : the app's API (/api/v1), the admin panel (/admin) and Reverb websockets (/app/)
# zon.sa       : the website (backend/routes/site.php) — the same Laravel on its own host; www.zon.sa → zon.sa
# media.zon.sa : signed photo links of the private MinIO bucket (GET/HEAD only)

# Architecture §14.2 «الشبكة»: 60 requests a minute per address, burst 20 — before PHP.
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
# The website: pages for people and crawlers (photos come from media.zon.sa, outside this limit).
limit_req_zone $binary_remote_addr zone=site:10m rate=300r/m;
limit_req_status 429;

# Every line carries the trace id Laravel answered with (X-Request-Id): grep one id across nginx, Laravel and the agents service.
log_format zon '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time trace=$sent_http_x_request_id';

server {
    listen 80;
    listen [::]:80;
    server_name api.zon.sa media.zon.sa;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name zon.sa www.zon.sa;
    return 301 https://zon.sa$request_uri;
}

# One certificate for both names: certbot certonly --nginx -d zon.sa -d www.zon.sa
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zon.sa;
    ssl_certificate     /etc/letsencrypt/live/zon.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zon.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://zon.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zon.sa;

    root /var/www/zon/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/zon.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zon.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/zon-site.log zon;
    client_max_body_size 1m;   # forms only; photos are uploaded through the API

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # The website's own files: every link carries ?v= of the file's content, so a long cache is safe. (No
    # add_header here: one in a location drops the server's HSTS and nosniff for it.)
    location /site/ {
        expires 30d;
        try_files $uri =404;
    }

    # The API and the panel live on api.zon.sa only.
    location /api/ {
        return 404;
    }
    location /admin {
        return 404;
    }

    # Pages, robots.txt, sitemap.xml and /.well-known/ (the app's link files) are answered by Laravel.
    location / {
        limit_req zone=site burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.zon.sa;

    root /var/www/zon/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.zon.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zon.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/zon-api.log zon;
    client_max_body_size 20m;   # one photo or document (the agents' phash limit is 20 MB too)

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The app's API: the per-address limit applies before PHP.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Laravel Reverb (Pusher protocol): the app connects to wss://api.zon.sa/app/{key}.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Admin panel and everything else Laravel serves. The panel's address list and 2FA are enforced in
    # Laravel (ADMIN_ALLOWED_IPS · RestrictAdminIps) — PHP-FPM sees the real client address directly.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;   # an AI call stops at 20 s and the fallback answers — nothing waits longer
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.zon.sa;

    ssl_certificate     /etc/letsencrypt/live/media.zon.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.zon.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/zon-media.log zon;

    # The bucket is private: a link works only with its signature and until it expires (MINIO_PUBLIC_URL in
    # backend/.env). Links are signed for host 127.0.0.1:9000, so MinIO must receive that host.
    location / {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_buffering off;
    }
}
