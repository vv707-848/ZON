; /etc/php/8.5/fpm/conf.d/99-zon.ini AND /etc/php/8.5/cli/conf.d/99-zon.ini — then: systemctl restart php8.5-fpm
; PHP's own defaults refuse every photo above 2 MB (upload_max_filesize) and can run out of memory while a large
; photo is redrawn. The backend accepts photos up to 8 MB (config/zon.php media.max_kb) and decodes them whole
; (width × height × 4 bytes; 36 MP at most): `php artisan zon:doctor` checks these values («رفع الصور ومعالجتها»).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
; nginx already stops bodies above 20 MB (client_max_body_size); one photo per request.
max_file_uploads = 4
expose_php = Off
; PCRE's JIT (libpcre2 10.42, Ubuntu 24.04) skipped matches on some CPUs: «055 123 4567» reached the model unmasked on
; Intel Xeon 6975P-C, and was masked on AMD EPYC and with the JIT off (measured on 8 CI runners). Masking costs
; 0.06 ms a call without it. `php artisan zon:doctor` checks the masking on this machine («إخفاء البيانات قبل الذكاء»).
pcre.jit = 0
