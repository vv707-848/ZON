; /etc/supervisor/conf.d/zon.conf — app node. `supervisorctl status` lists every program; logs in /var/log/zon/.
; Queues: index = ONE worker so index versions go out in order · ai = AI text cleaning (calls the agents
; service, up to 20 s) · notify, default, media = notifications, scheduled jobs (and the heartbeat), image hashes.

[program:zon-worker-index]
command=php /var/www/zon/backend/artisan queue:work redis --queue=index --sleep=1 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/zon/worker-index.log

[program:zon-worker-ai]
command=php /var/www/zon/backend/artisan queue:work redis --queue=ai --timeout=60 --sleep=1 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/log/zon/worker-ai.log

[program:zon-worker-general]
command=php /var/www/zon/backend/artisan queue:work redis --queue=notify,default,media --sleep=1 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
user=www-data
numprocs=2
autostart=true
autorestart=true
; longer than the longest job here (SendAnnouncement 900 s; scheduled jobs 600 s), so a stop lets it finish
stopwaitsecs=910
redirect_stderr=true
stdout_logfile=/var/log/zon/worker-general.log

; Websockets on 127.0.0.1:8080 only — nginx proxies /app/ to it (and the AI tunnel uses 18080 because of it).
[program:zon-reverb]
command=php /var/www/zon/backend/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/zon/reverb.log

; The agents service (PydanticAI + MCP) on 127.0.0.1:8100 — reads /var/www/zon/agents/.env.
; One JSON line per request with request_id = the trace id Laravel sent (X-Request-Id).
[program:zon-agents]
command=/var/www/zon/agents/.venv/bin/zon-agents serve
directory=/var/www/zon/agents
user=zon-agents
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/zon/agents.log
